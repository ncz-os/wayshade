[preset]
name=Galaxy zoom
description=A powers-of-ten dive: a whole spiral galaxy with dust lanes and star-forming knots, then a plunge through its bulge to the black hole at its center, lensing the galactic band around it. Repeats with a new galaxy.
accuracy=artistic
sources=Exponential disk with logarithmic spiral arms and a Gaussian bulge. The galaxy is scaled down by many orders of magnitude so the dive fits in a minute.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5, light mode) 45 fps, p95 33.5 ms; Mali-G720 (1080p) 58 fps, p95 18.7 ms; RTX 2060 (PRIME offload, 1080p, rich mode) 60 fps
[blackhole]
scene=galaxy-zoom

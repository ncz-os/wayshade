[preset]
name=Black hole merger
description=Two black holes spiral together faster and faster, merge in a flash, and the new hole rings down while their shared disk falls in to feed it. Gravitational waves ripple outward as a two-armed spiral. Repeats with new masses.
accuracy=artistic
sources=Quadrupole inspiral a ~ (t_c - t)^(1/4) with the chirping orbital phase (Peters 1964), about 5 percent of the mass radiated as in GW150914 (LIGO and Virgo 2016), damped quadrupole ringdown. Time and length scaled for viewing.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5, light mode) 60 fps, p95 16.9 ms; Mali-G720 (1080p, rich mode) 56 fps, p95 19.7 ms (light mode 60 fps); RTX 2060 (PRIME offload, 1080p, rich mode) 60 fps
[blackhole]
scene=merger

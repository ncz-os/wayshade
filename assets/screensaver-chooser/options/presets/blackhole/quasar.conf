[preset]
name=Quasar
description=An active galactic nucleus seen from about 25 degrees off the pole: a very bright disk, a dusty torus around it and twin relativistic jets.
accuracy=artistic
sources=Unified model of active galactic nuclei (Antonucci 1993; Urry and Padovani 1995): viewing angle decides whether the torus hides the disk. Sizes are scaled for viewing.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 48 fps, p95 20.9 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps
[blackhole]
palette=slingshot
flyby=slow-orbit
distance-min=36
distance-max=42
inclination=65
spin=0.8
disk-outer=30
disk-brightness=1.3
bloom=1.3
jet=1.6
jet-length=90
torus=0.6
nebula=0.3
speed=0.5

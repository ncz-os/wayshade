[preset]
name=Quasar (edge-on)
description=The same quasar seen almost in the plane of the dusty torus: the torus hides the bright disk and the jets stand out to the sides, the way an obscured (type 2) active nucleus looks.
accuracy=artistic
sources=Unified model of active galactic nuclei (Antonucci 1993; Urry and Padovani 1995). Sizes are scaled for viewing.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 50 fps, p95 20.1 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps

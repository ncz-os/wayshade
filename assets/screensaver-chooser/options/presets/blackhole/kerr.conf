[preset]
name=Kerr (spinning)
description=A near-maximally spinning black hole: the disk reaches in close to the horizon and the approaching side is strongly beamed. A stylized approximation of frame dragging, not full Kerr geodesics.
accuracy=artistic
sources=Bardeen, Press and Teukolsky 1972 (innermost stable orbit shrinks from 3 to about 0.6 r_s as spin goes from 0 to 0.998 for prograde orbits). The spin option moves the disk edge and speeds the disk; the ray tracing is still Schwarzschild.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 53 fps, p95 19.1 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps
[blackhole]
palette=faithful
flyby=slow-orbit
distance-min=15
distance-max=19
inclination=70
spin=0.998
beaming=1.6
disk-brightness=1.2
bloom=0.8
speed=0.6

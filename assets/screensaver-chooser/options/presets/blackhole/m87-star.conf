[preset]
name=M87*
description=The 6.5 billion solar mass black hole in the galaxy Messier 87 as the Event Horizon Telescope imaged it: a bright ring, brighter on one side, with a long relativistic jet, seen about 17 degrees from the pole.
accuracy=faithful
sources=EHT Collaboration 2019 (shadow about 42 microarcseconds, mass 6.5e9 solar masses, distance 16.8 Mpc, jet axis about 17 degrees from the line of sight); horizon scale r_s = 2.95 km per solar mass = 1.9e10 km (about 130 AU). Colors are EHT false color; the jet is much shorter than the real one.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 54 fps, p95 18.7 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps
[blackhole]
palette=eht
flyby=drift
distance-min=15
distance-max=18
inclination=73
spin=0.94
disk-outer=9
disk-brightness=0.8
beaming=1.7
jet=1.8
jet-length=160
bloom=0.45
star-density=0.25
nebula=0
speed=0.35
hot-sector=0

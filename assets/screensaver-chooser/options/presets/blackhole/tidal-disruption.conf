[preset]
name=Tidal disruption
description=A star falls toward a black hole on a parabolic orbit, is stretched and torn apart at closest approach, and its debris wraps around the hole into a new, flaring disk while the rest escapes. Repeats.
accuracy=artistic
sources=Parabolic orbit from Barker's equation; fallback luminosity ~ t^(-5/3) (Rees 1988, Phinney 1989); circularization near twice the pericenter. The star is drawn larger than life.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5, light mode) 37 fps, p95 33.5 ms; Mali-G720 (1080p) 60 fps, p95 16.7 ms; RTX 2060 (PRIME offload, 1080p, rich mode) 60 fps
[blackhole]
scene=tidal-disruption

[preset]
name=Blazar
description=A quasar whose jet points almost straight at us: relativistic beaming makes the nucleus blaze, and the disk is seen face-on.
accuracy=artistic
sources=Urry and Padovani 1995 (blazars are jets viewed within a few degrees of the axis). Sizes are scaled for viewing.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 49 fps, p95 20.7 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps

[preset]
name=Microquasar (Cygnus X-1)
description=A stellar-mass black hole with a small hot disk and a faint jet. Modeled on Cygnus X-1. Add --companion=1 for the blue supergiant and its gas stream.
accuracy=artistic
sources=Miller-Jones et al 2021 (black hole 21.2 solar masses, spin above 0.9, inclination about 27 degrees, distance 2.2 kpc); companion HDE 226868, a 40.6 solar mass O9.7 supergiant, orbital period 5.6 days. The real system is wind fed; the stream is drawn for effect. With --companion=1 the star and stream are lensed with the rest of the scene.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 52 fps, p95 19.6 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps
[blackhole]
palette=faithful
flyby=slow-orbit
distance-min=32
distance-max=36
inclination=63
spin=0.98
disk-outer=14
disk-brightness=1.2
companion=0
jet=0.6
jet-length=30
bloom=0.6
nebula=0.3
speed=0.6

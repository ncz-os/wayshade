[preset]
name=Binary quasars
description=A pair of feeding supermassive black holes in faithful blackbody colors, close and bright, with a heavier primary and strong beaming, seen from high above their orbit.
accuracy=artistic
sources=Candidate supermassive binaries such as OJ 287 (about 1.8e10 and 1.5e8 solar masses, 12 year period); mass ratio and separation scaled for viewing.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5, light mode) 60 fps, p95 16.8 ms; Mali-G720 (1080p, rich mode) 53 fps, p95 19.5 ms (light mode 60 fps); RTX 2060 (PRIME offload, 1080p, rich mode) 60 fps
[blackhole]
scene=binary
palette=faithful
mass-ratio=0.35
separation=13
beaming=1.3
inclination=40

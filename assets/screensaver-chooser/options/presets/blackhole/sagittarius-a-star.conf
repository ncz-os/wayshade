[preset]
name=Sagittarius A*
description=The 4.3 million solar mass black hole at the center of the Milky Way as the Event Horizon Telescope imaged it: a small, hot, faint flow with an orange crescent and a thin photon ring, seen about 30 degrees from the pole.
accuracy=faithful
sources=EHT Collaboration 2022 (shadow about 52 microarcseconds, inclination below 50 degrees from the pole); GRAVITY 2019 (mass 4.3e6 solar masses, distance 8.28 kpc); horizon scale r_s = 2.95 km per solar mass = 1.27e7 km. Colors are EHT false color; the flow is drawn as a thin disk.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5) 54 fps, p95 18.6 ms; Mali-G720 (1080p) 60 fps; Radeon Pro 5500M (Navi14) 60 fps

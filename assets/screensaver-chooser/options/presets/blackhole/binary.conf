[preset]
name=Binary black holes
description=Two black holes orbit each other, each wrapped in its own small disk, inside a shared circumbinary ring; each lenses the other, and faint gravitational-wave ripples spiral outward.
accuracy=artistic
sources=Kepler orbit with the period scaled for viewing; minidisks truncated at about 0.4 of the separation and a circumbinary ring beyond twice it, as in circumbinary disk simulations (for example Farris et al. 2014). Lensing superposes the two Schwarzschild fields, which is not a solution of general relativity.
min-gpu-class=weak
measured=Intel UHD 630 at the weak-class defaults (render scale 0.5, light mode) 60 fps, p95 16.8 ms; Mali-G720 (1080p, rich mode) 52 fps, p95 19.9 ms (light mode 60 fps); RTX 2060 (PRIME offload, 1080p, rich mode) 60 fps
[blackhole]
scene=binary
